# In Auto mode the GFX5 computes its own humidity setpoint from the humidity
# index and the outdoor temperature, and overwrites dp 13. The outdoor
# temperature is not exposed as a data point: it comes from the optional probe
# on SNSR1/SNSR2 or from Tuya's MCU weather service. Set the mode to Manual to
# make dp 13 settable from Home Assistant. The unit keeps a separate setpoint
# for each mode and restores it when the mode changes.
name: Humidifier
products:
  - id: makjxwag2haiqcmd
    manufacturer: GeneralAire
    model: GFX5
entities:
  - entity: humidifier
    class: humidifier
    dps:
      - id: 1
        name: switch
        type: boolean
      - id: 13
        name: humidity
        type: integer
        range:
          min: 10
          max: 75
        mapping:
          - step: 1
      - id: 14
        name: current_humidity
        type: integer
      - id: 24
        name: mode
        type: string
        optional: true
        mapping:
          - dps_val: Auto
            value: Auto
          - dps_val: Manual
            value: Manual
  - entity: switch
    name: Furnace blower
    category: config
    dps:
      - id: 109
        name: switch
        type: boolean
        optional: true
  - entity: select
    name: Humidity index
    category: config
    dps:
      - id: 106
        name: option
        type: string
        optional: true
        mapping:
          - dps_val: "1"
            value: "1"
          - dps_val: "2"
            value: "2"
          - dps_val: "3"
            value: "3"
          - dps_val: "4"
            value: "4"
          - dps_val: "5"
            value: "5"
          - dps_val: "6"
            value: "6"
          - dps_val: "7"
            value: "7"
          - dps_val: "8"
            value: "8"
          - dps_val: "9"
            value: "9"
          - dps_val: "10"
            value: "10"
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 18
        name: option
        type: string
        optional: true
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
